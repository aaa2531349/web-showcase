<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gent — autonomous AI sales agent">
  <title>Gent — AI Sales Agent</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505}
    a:focus,button:focus,input:focus,textarea:focus,select:focus,iframe:focus{outline:none!important}
    .site-frame{display:block;width:100%;height:calc(100% + 88px);border:0;background:#050505}
    @media(max-width:767px){.site-frame{height:calc(100% + 104px)}}
    .offline{position:fixed;inset:0;display:none;place-items:center;padding:32px;color:#f4f4f4;text-align:center;font:15px/1.6 ui-sans-serif,system-ui,sans-serif;background:radial-gradient(circle at 50% 30%,#353535,#050505 56%)}
    .offline strong{display:block;margin-bottom:10px;color:#fff;font-size:34px;letter-spacing:-.04em}
  </style>
</head>
<body>
  <iframe id="gent-site" class="site-frame" src="./reference.html" title="Gent — AI Sales Agent" allow="fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div class="offline" id="offline"><div><strong>Gent</strong>当前无法连接参考页面，请检查网络后刷新。</div></div>
  <script>const frame=document.querySelector('#gent-site'),offline=document.querySelector('#offline');frame.addEventListener('error',()=>{frame.style.display='none';offline.style.display='grid'})</script>
</body>
</html>
