<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seven · Web Showcase</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d0d0d;
        color: #f4f4f1;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus {
        outline: none;
      }
      .shell {
        width: min(1200px, calc(100% - 40px));
        margin: auto;
        padding: 48px 0 100px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #2c2c2c;
        padding-bottom: 26px;
      }
      .brand {
        font-size: 18px;
        font-weight: 600;
      }
      .meta {
        font-size: 12px;
        color: #777;
      }
      .intro {
        padding: 110px 0 80px;
      }
      .intro h1 {
        font-size: clamp(52px, 9vw, 120px);
        line-height: 0.9;
        letter-spacing: -0.07em;
        margin: 0;
        max-width: 900px;
      }
      .intro p {
        color: #888;
        max-width: 460px;
        margin: 32px 0 0;
        line-height: 1.6;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
      .card {
        display: block;
        background: #181818;
        border: 1px solid #282828;
        border-radius: 20px;
        padding: 12px;
        transition:
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.4s;
      }
      .card:hover {
        transform: translateY(-8px);
        border-color: #555;
      }
      .preview {
        aspect-ratio: 16/9;
        border-radius: 12px;
        overflow: hidden;
        background: #eee;
        position: relative;
      }
      .preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .preview:after {
        content: "View project ↗";
        position: absolute;
        right: 16px;
        bottom: 16px;
        background: #fff;
        color: #111;
        padding: 10px 14px;
        border-radius: 99px;
        font-size: 12px;
        transform: translateY(10px);
        opacity: 0;
        transition: 0.35s;
      }
      .card:hover .preview:after {
        transform: none;
        opacity: 1;
      }
      .caption {
        display: flex;
        justify-content: space-between;
        padding: 18px 6px 8px;
      }
      .caption span:last-child {
        color: #666;
        font-size: 13px;
      }
      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .intro {
          padding: 80px 0 55px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div class="brand">Seven / Web Showcase</div>
        <div class="meta">06 PROJECTS</div>
      </header>
      <section class="intro">
        <h1>Selected<br />web pages.</h1>
        <p>网页复刻与交互原型的统一展示空间。后续页面会持续收录在这里。</p>
      </section>
      <section class="grid">
        <a class="card" href="./kind-stage/"
          ><div class="preview">
            <img
              src="./kind-stage/assets/deep-focus.png"
              alt="Alex Fenwick 网页预览"
            />
          </div>
          <div class="caption">
            <span>Alex Fenwick</span><span>Author portfolio · 2026</span>
          </div></a
        >
        <a class="card" href="./gent/"
          ><div class="preview">
            <img
              src="https://framerusercontent.com/images/mPneAxWadyGkSbTwiHH2jmfWLE.png?width=1825&amp;height=1081"
              alt="Gent 网页预览"
            />
          </div>
          <div class="caption">
            <span>Gent</span><span>AI sales agent · 2026</span>
          </div></a
        ><a class="card" href="./detoy/"
          ><div class="preview">
            <video
              src="./detoy/assets/hero.mp4"
              autoplay
              muted
              loop
              playsinline
              style="width: 100%; height: 100%; object-fit: cover"
            ></video>
          </div>
          <div class="caption">
            <span>Detoy</span><span>Design studio · 2026</span>
          </div></a
        ><a class="card" href="./menowo/"
          ><div class="preview">
            <img
              src="./menowo/public/assets/hero-girl.jpg"
              alt="Menowo 网页预览"
            />
          </div>
          <div class="caption">
            <span>Menowo</span><span>Creative studio · 2026</span>
          </div></a
        ><a class="card" href="./opus/"
          ><div class="preview">
            <img
              src="./opus/public/assets/FPeepKKHxtAQvBoZw06THrhotfE.png"
              alt="Opus 网页预览"
            />
          </div>
          <div class="caption">
            <span>Opus</span><span>Digital agency · 2026</span>
          </div></a
        ><a class="card" href="./loops/"
          ><div class="preview">
            <img
              src="./loops/public/assets/EymRsmPTU0JW506onOoAc7xi4t4.jpg"
              alt="Loops 网页预览"
            />
          </div>
          <div class="caption">
            <span>Loops</span><span>Landing page · 2026</span>
          </div></a
        >
      </section>
    </main>
  </body>
</html>
